name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
    build-and-test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up .NET
              uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore

            # Warnings are errors and code style is enforced in the build (Directory.Build.props).
            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Test
              run: dotnet test --configuration Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

            - name: Upload test results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: test-results
                  path: TestResults/*.trx
                  if-no-files-found: ignore
